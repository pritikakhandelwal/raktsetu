# Production behind a hosting platform's HTTPS proxy. Start with --spring.profiles.active=postgres,prod
# (or SPRING_PROFILES_ACTIVE=postgres,prod).

# Use the visitor's real address from X-Forwarded-For. Without this every request appears to come from the proxy,
# and the per-address sign-in lockout would lock everyone out after a few wrong passwords.
server.forward-headers-strategy=native
# The sign-in cookie only travels over HTTPS.
server.servlet.session.cookie.secure=true
# The interactive API explorer is for development; the API itself is unchanged.
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
