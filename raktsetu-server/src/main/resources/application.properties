spring.application.name=raktsetu
server.port=8080
# Do not reveal stack traces in error responses.
server.error.include-stacktrace=never
spring.main.banner-mode=off

# Embedded database stored as a file in the data folder: nothing to install. Use the "postgres" profile for PostgreSQL.
raktsetu.data-dir=raktsetu-data
spring.datasource.url=jdbc:h2:file:./${raktsetu.data-dir}/raktsetu;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=raktsetu
spring.datasource.password=
spring.flyway.locations=classpath:db/migration

# Monitoring. Health is public (load balancers and uptime checks need it); full details, metrics and the Prometheus
# endpoint need an administrator's session. Structured JSON logs: --logging.structured.format.console=ecs
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.info.java.enabled=true
info.app.name=RaktSetu
info.app.description=Expiry-aware blood redistribution network

# API documentation: /api-docs (browsable) and /v3/api-docs (OpenAPI JSON).
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/api-docs
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.tags-sorter=alpha

# Urgent alerts by SMS (Twilio) or WhatsApp (Meta Cloud API). Leave unset to write alerts to the log only.
# Set these as environment variables, e.g. RAKTSETU_ALERTS_SMS_AUTH_TOKEN; never commit keys.
# raktsetu.alerts.sms.account-sid=
# raktsetu.alerts.sms.auth-token=
# raktsetu.alerts.sms.from=
# raktsetu.alerts.whatsapp.phone-number-id=
# raktsetu.alerts.whatsapp.token=
# raktsetu.alerts.whatsapp.template=raktsetu_alert
