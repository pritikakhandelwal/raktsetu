spring.application.name=raktsetu
server.port=8080
# Do not reveal stack traces in error responses.
server.error.include-stacktrace=never
spring.main.banner-mode=off

# Embedded database stored as a file in the data folder: nothing to install. Use the "postgres" profile for PostgreSQL.
raktsetu.data-dir=raktsetu-data
spring.datasource.url=jdbc:h2:file:./${raktsetu.data-dir}/raktsetu;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=raktsetu
spring.datasource.password=
spring.flyway.locations=classpath:db/migration
