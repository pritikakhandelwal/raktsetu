name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, test and measure coverage
        run: ./mvnw -B -ntp verify
      - name: Upload executable JAR
        if: matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: raktsetu-jar
          path: raktsetu-cli/target/raktsetu.jar
      - name: Upload coverage reports
        if: matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: '**/target/site/jacoco/'

  postgres:
    name: Server tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: raktsetu
          POSTGRES_USER: raktsetu
          POSTGRES_PASSWORD: raktsetu
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U raktsetu"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAKTSETU_TEST_DB_URL: jdbc:postgresql://localhost:5432/raktsetu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run the server tests against PostgreSQL
        run: ./mvnw -B -ntp -pl raktsetu-server -am verify -DskipFrontend
