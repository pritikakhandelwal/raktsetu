# Pune district pilot network (synthetic facilities at real towns). Values are illustrative and not yet calibrated
# against real data; docs/research/forecasting/findings.md reports what this baseline produces.
name=pune-pilot

# Units per day for a hospital of demand weight 1.0 (a typical city hospital). Illustrative, in the proportions
# commonly reported for Indian hospitals: red cells most, then plasma and platelets, little whole blood.
demand.RED_CELLS=6.0
demand.PLATELETS=2.5
demand.PLASMA=3.0
demand.WHOLE_BLOOD=0.5

# Collections divided by expected demand, per component. India collects more than it uses overall (collection rose 24%
# from 2023 to 2025 while discards more than doubled). Not yet calibrated.
supply_factor.RED_CELLS=1.10
supply_factor.PLATELETS=1.10
supply_factor.PLASMA=1.10
supply_factor.WHOLE_BLOOD=1.10
